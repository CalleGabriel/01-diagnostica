<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Escolar — Bloque D</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>Calculadora de Promedios UETS</h1>
  </header>

  <main class="container">
    <div class="card">
      <label for="nota1">Primera Nota:</label>
      <input type="number" id="nota1" placeholder="Ej: 8.5" min="0" max="10" step="0.1">

      <label for="nota2">Segunda Nota:</label>
      <input type="number" id="nota2" placeholder="Ej: 9.0" min="0" max="10" step="0.1">

      <button id="btn-calcular">Calcular Promedio</button>

      <div id="resultado">Esperando datos...</div>
    </div>
  </main>

  <footer>
    <p>3° BTI — Programación Móvil</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
