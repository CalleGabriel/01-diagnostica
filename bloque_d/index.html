<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Notas UETS — Bloque D</title>
  <!-- CORREGIDO: Vinculación correcta al archivo estilos.css -->
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <main class="contenedor">
    <header class="header">
      <h1>Calculadora de Notas UETS</h1>
      <p>Ingresa tus notas de aporte y examen:</p>
    </header> <!-- CORREGIDO: Se cerró la etiqueta header correctamente -->

    <section class="formulario">
      <div class="campo">
        <label for="nota1">Aporte Formativo (sobre 10):</label>
        <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Ej: 9.5">
      </div>

      <div class="campo">
        <label for="nota2">Examen Quimestral (sobre 10):</label>
        <!-- CORREGIDO: Se agregó el id="nota2" requerido por JavaScript -->
        <input type="number" id="nota2" name="nota_quimestral" min="0" max="10" step="0.1" placeholder="Ej: 8.5">
      </div>

      <!-- CORREGIDO: Se añadió el id="btn-calcular" para enlazar el evento -->
      <button id="btn-calcular">Calcular Promedio</button>
    </section>

    <div id="resultado" class="caja-resultado">
      Ingresa los valores y presiona calcular.
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
